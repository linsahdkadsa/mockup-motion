  for (const p of boxes) { ctx.strokeStyle = p.title ? '#ffe14d' : p.a && p.a.behind === true ? '#ff4fd8' : p.a && p.a.walk ? '#4fff8a' : '#ffffff';
    ctx.strokeRect(p.b[0], p.b[1], p.b[2] - p.b[0], p.b[3] - p.b[1]); ctx.fillStyle = ctx.strokeStyle; ctx.fillText(p.name, p.b[0] + 6, Math.max(26, p.b[1] - 8)); }
  ctx.restore();
  return { img: cv.toDataURL('image/jpeg', 0.9), warns };
};
// 看得见的新事件（mm package 用来提醒「X–Y 秒没有新事件」）：持续走路不算，走进画面 / 走出画面 / 站住才算
window.__beats = () => {
  const b = [], c = P.camera || {};
  if (c.from && c.to && (c.from[0] !== c.to[0] || c.from[1] !== c.to[1] || c.from[2] !== c.to[2])) b.push(c.at || 0);
  for (const a of ACT) {
    if (a.enter) b.push(a.enter.at || 0, (a.enter.at || 0) + (a.enter.dur || 0.55));
    if (a.exit) b.push(a.exit.at, a.exit.at + (a.exit.dur || 0.45));
    if (a.blink) b.push(...[].concat(a.blink.at ?? [1.1]));
    // appear（凭空弹出来）不算：出场要有来由，不推荐用它填空档
    if (a.walk) { if ((a.at || 0) > 0) b.push(a.at); if (a.until != null && a.until < DUR) b.push(a.until);
      let was = null; for (let t = 0; t <= DUR; t += 1 / FPS) { const on = walkOn(a, t);
        if (was !== null && on !== was) b.push(t); was = on; } }
  }
  let quiet = null;                                  // 落款出完以后是停留时间，不算空档
  if (TT) { const at = TT.at ?? DUR - (TT.hold || 1.2), nl = [].concat(TT.img ? [0] : TT.text).length; for (let i = 0; i < nl; i++) b.push(at + i * 0.1); quiet = at + (nl - 1) * 0.1; }
  return { beats: b, quietFrom: quiet };
};
// 渲染前检查：镜头框不能出底图（出了会留拖影）、时长不能超过底片、遮罩和底图比例要一样、楼后的角色要有遮罩、走路的 from/to/until 要写对
window.__precheck = () => {
  const e = [], c = P.camera || {};
  for (const [nm, f] of [['from', c.from], ['to', c.to]]) if (f) { const [x, y, w] = f, h = w * H / W;
    if (x < -1 || y < -1 || x + w > BG.width + 1 || y + h > BG.height + 1) e.push(`camera.${nm} [${f}] 超出底图（${BG.width}×${BG.height}）：取景框高 = 宽 × ${H}/${W} = ${Math.round(h)}`); }
  if (P.plateN && DUR > P.plateN / (P.plateFps || FPS) + 0.05) e.push(`时长 ${DUR}s 超过底片 ${(P.plateN / (P.plateFps || FPS)).toFixed(2)}s（人会定住）：缩短 duration 或出更长的底片`);
  // 遮罩、底片帧要和底图宽高比例一样（大小可以不同，会自动换算）；比例不一样会错位
  const ar = im => im.width / im.height, bar = ar(BG);
  for (const [nm, im, how] of [[P.near, NEAR, `先跑 mm plate 生成 ${P.base}，再用 mm occluder 空街景 去近景图 --target ${P.base} 重做 ${P.near}`],
    [P.sky, SKY, `重新跑 mm sky ${P.base}（用了底片的话，mm plate 会一起写出 sky.png）`],
    ['底片帧 f_000.jpg', SEQ[0], `${P.base} 和底片要来自同一次 mm plate：重新跑一次 mm plate`],
    ['行人遮罩 p_000.png', PP[0], `重新跑一次 mm plate`]])
    if (im && Math.abs(ar(im) / bar - 1) > 0.01) e.push(`${nm} 是 ${im.width}×${im.height}，底图 ${P.base} 是 ${BG.width}×${BG.height}，宽高比例对不上，画上去会错位：${how}`);
  const back = ACT.filter(a => a.behind === true && !a.walk);
  if (back.length && !NEAR && !SKY) e.push(`「${back.map(a => String(a.img).split('/').pop()).join('、')}」写了 behind: true（藏在楼后），可是没有 near.png 也没有 sky.png，它会整个露在楼前面：用 mm occluder 做近处遮挡、或 mm sky 底图做天空遮罩（mm plate 会一起写出 sky.png），再在 package.json 里写上 "near" 或 "sky"；不用藏就把 behind 删掉`);
  ACT.forEach((a, i) => { if (!a.walk) return; const nm = `走路的「${String([].concat(a.walk)[0]).split('/').pop()}」（actors 第 ${i + 1} 个）`;
    for (const key of ['from', 'to']) if (!Array.isArray(a[key]) || a[key].length !== 3 || a[key].some(v => typeof v !== 'number' || !isFinite(v)))
      e.push(`${nm} 的 ${key} 要写 3 个数 [脚底 x, 脚底 y, 身高]，现在是 ${JSON.stringify(a[key] ?? null)}`);
    if (a.until != null && a.until <= (a.at || 0)) e.push(`${nm} 的 until（${a.until}）要比 at（${a.at || 0}）晚：until 是「走到 to 的那一刻」，不是「走多久」。比如从 ${a.at || 0} 秒开始走 1.2 秒，就写 until ${+((a.at || 0) + 1.2).toFixed(2)}`); });
  return e;
};
// 音效：大怪探出 whoosh、走路的每步一声轻脚步、落款 pop
window.__events = () => [
  ...ACT.filter(a => a.enter).map(a => ({ t: a.enter.at || 0, kind: 'whoosh', dur: 0.45, gain: 0.35 })),
  ...ACT.filter(a => a.exit).map(a => ({ t: a.exit.at, kind: 'whoosh', dur: 0.4, gain: 0.3 })),
  ...ACT.filter(a => a.walk).flatMap(a => { const ev = [], per = 2 * (a.step || 3) / FPS, ex = a.after === 'exit', end = ex ? DUR : (a.until ?? DUR);
    for (let t = (a.at || 0) + per / 2; t < end; t += per) { if (ex && t > (a.until ?? DUR) && !walkOn(a, t)) break;   // exit：走远（缩没了）或走出画面，脚步声就停
      ev.push({ t, kind: 'step', gain: 0.15 }); } return ev; }),
  ...ACT.filter(a => a.appear != null).map((a, i) => ({ t: a.appear.at ?? a.appear, kind: 'pop', pitch: 1.2 + 0.1 * (i % 3), gain: 0.35 })),
  ...(TT ? [].concat(TT.img ? [0] : TT.text).map((_, i) => ({ t: (TT.at ?? DUR - (TT.hold || 1.2)) + i * 0.1, kind: 'pop', pitch: 1 + i * 0.1, gain: 0.55 })) : []),
];
</script></body></html>
